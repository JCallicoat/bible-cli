[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-cli"
version = "0.1.0"
requires-python = ">=3.9"

[project.scripts]
bible-cli = "bible_cli.main:main"

[tool.setuptools]
packages = ["bible_cli"]

[tool.setuptools.package-data]
bible_cli = ["translations/*.db"]
