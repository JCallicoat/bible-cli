[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-cli"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.0"]

[project.scripts]
bible-cli = "bible_cli.main:main"
bible-gui = "bible_cli.gui:main"

[tool.setuptools]
packages = ["bible_cli"]

[tool.setuptools.package-data]
bible_cli = ["translations/*.db", "resources/*.png"]
